```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header>
        <h1>Student Management System</h1>
        <p>Serverless Web Application on AWS</p>
    </header>


    <main>

        <!-- ========================= -->
        <!-- AUTHENTICATION SECTION -->
        <!-- ========================= -->

        <section class="card" id="authSection">

            <h2>Account</h2>

            <input
                type="email"
                id="authEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="authPassword"
                placeholder="Password"
                required
            >

            <input
                type="text"
                id="otp"
                placeholder="Enter OTP"
            >

            <button type="button" id="signUpButton">
                Sign Up
            </button>

            <button type="button" id="confirmButton">
                Verify OTP
            </button>

            <button type="button" id="loginButton">
                Login
            </button>

            <button type="button" id="logoutButton">
                Logout
            </button>

            <p id="authMessage"></p>

        </section>


        <!-- ========================= -->
        <!-- ADD STUDENT -->
        <!-- ========================= -->

        <section class="card">

            <h2>Add Student</h2>

            <form id="studentForm">

                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >


                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                    required
                >


                <label for="course">Course</label>

                <input
                    type="text"
                    id="course"
                    placeholder="Enter course"
                    required
                >


                <button type="submit">
                    Add Student
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- ========================= -->
        <!-- STUDENT LIST -->
        <!-- ========================= -->

        <section class="card">

            <h2>Students</h2>

            <button type="button" id="loadStudents">
                Load Students
            </button>

            <div id="students">

                <p>
                    Click "Load Students" to view students.
                </p>

            </div>

        </section>

    </main>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer>

        <p>
            Built with AWS Lambda, API Gateway,
            Amplify, DynamoDB & Cognito
        </p>

    </footer>


    <!-- ========================= -->
    <!-- AWS COGNITO SDK -->
    <!-- MUST LOAD BEFORE SCRIPT.JS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>


    <!-- ========================= -->
    <!-- YOUR JAVASCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>

</body>

</html>
```
